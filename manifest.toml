#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "elk"
name = "Elk"
description.en = "Nimble Mastodon web client"
description.fr = "Client Web Mastodon"

version = "0.17.2~ynh1"

maintainers = ["trendless"]

[upstream]

license = "MIT"
# website = ""
demo = "https://elk.zone"
admindoc = "https://docs.elk.zone"
userdoc = "https://docs.elk.zone"
code = "https://github.com/elk-zone/elk"
fund = "https://opencollective.com/elk"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "2G"
ram.build = "4G"
ram.runtime = "300M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.nuxt_public_default_server]
    ask.en = "Default server"
    ask.fr = "Serveur par default"
    help.en = "The domain of the Mastodon (or Glitch-soc, GoToSocial, etc) server whose local feed will be displayed prior to login; if `single instance` (below) is set to `true`, only its accounts may log in; e.g., `mastodon.social`"
    help.fr = "Le domaine du serveur Mastodon (ou Glitch-soc, GoToSocial, etc.) dont le flux local sera affiché avant la connexion ; si `single instance` (ci-dessous) est défini sur `true`, seuls les comptes de ce serveur pourront se connecter ; par exemple : `mastodon.social`"
    type = "string"
    default = "m.webtoo.ls"

    [install.nuxt_public_single_instance]
    ask.en = "Single instance?"
    ask.fr = "Instance unique ?"
    help.en = "Restrict this installation of Elk to only allow login with accounts from the `Default server` (above)?"
    help.fr = "Limiter cette installation d'Elk à n'autoriser la connexion qu'avec les comptes du `serveur par default` (ci-dessus) ?"
    type = "boolean"
    default = false

    [install.nuxt_public_privacy_policy_url]
    ask.en = "Privacy Policy URL"
    ask.fr = "URL de la politique de confidentialité"
    help.en = "The URL of the privacy policy that covers this installation of Elk; e.g., `https://mastodon.social/privacy-policy`"
    help.fr = "L'URL de la politique de confidentialité qui couvre cette installation d'Elk ; par exemple : `https://mastodon.social/privacy-policy`"
    type = "string"
    default = "https://docs.elk.zone/privacy"

[resources]

    [resources.sources]

    [resources.sources.main]
    url = "https://github.com/elk-zone/elk/archive/refs/tags/v0.17.2.tar.gz"
    sha256 = "c230a7802fc2c3a5472fca4f7ad96c4d4b380233127c86b63a24d7378da0757d"
    autoupdate.strategy = "latest_github_release"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 5314

    [resources.nodejs]
    version = "24"
